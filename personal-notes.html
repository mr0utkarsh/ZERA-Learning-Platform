<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZERA Personal Notes</title>
  <meta name="description" content="Personal notes dashboard for student study records and reminders." />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <script src="./js/api.js" defer></script>
  <script src="./js/personal-notes.js" defer></script>
  <script src="./js/storage.js" defer></script>
  <script src="./js/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="./index.html" class="brand" aria-label="ZERA home"><span class="brand-mark"><span>Z</span></span><span>ZERA</span></a>
      <nav class="nav" aria-label="Main navigation">
        <a href="./dashboard.html">Dashboard</a>
        <a href="./notes.html">Notes</a>
        <a href="./personal-notes.html" class="active">Personal Notes</a>
      </nav>
      <div class="header-actions"><a class="btn btn-primary btn-small" href="./dashboard.html">Dashboard</a></div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="panel">
        <h2>Personal notes</h2>
        <p class="muted" style="margin-top:6px;">Capture your own questions, formulas, and reflections. Notes are saved to your account.</p>

        <form id="personalNotesForm" style="margin-top:18px;">
          <input type="hidden" name="noteId" id="noteId" value="" />
          <div class="field">
            <label for="noteTitle">Title</label>
            <input id="noteTitle" name="title" type="text" placeholder="e.g. Quadratic formulas" required maxlength="160" />
          </div>
          <div class="field" style="margin-top:14px;">
            <label for="noteCategory">Category</label>
            <select id="noteCategory" name="category">
              <option value="Personal">Personal</option>
              <option value="Formula">Formula</option>
              <option value="Question">Question</option>
              <option value="Revision">Revision</option>
            </select>
          </div>
          <div class="field" style="margin-top:14px;">
            <label for="noteContent">Content</label>
            <textarea id="noteContent" name="content" placeholder="Write your note..." required maxlength="20000" rows="8"></textarea>
          </div>
          <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn btn-primary" type="submit">Save note</button>
            <button class="btn btn-ghost" type="button" id="cancelEdit" hidden>Cancel edit</button>
          </div>
        </form>

        <div class="notice" id="noteMessage" aria-live="polite" style="margin-top:14px;"></div>

        <h3 style="margin-top:26px;">Saved notes</h3>
        <div id="personalNotesList" style="margin-top:12px;"></div>
      </div>
    </div>
  </main>

  <footer class="footer"><div class="container"><small>© 2026 ZERA</small></div></footer>
</body>
</html>
