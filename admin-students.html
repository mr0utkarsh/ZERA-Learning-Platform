<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZERA Student Management</title>
  <meta name="description" content="Search, filter, and manage student accounts in the ZERA admin portal." />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <script src="./js/storage.js" defer></script>
  <script src="./js/auth.js" defer></script>
  <script src="./js/admin.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="./index.html" class="brand" aria-label="ZERA home"><span class="brand-mark"><span>Z</span></span><span>ZERA</span></a>
      <nav class="nav" aria-label="Admin navigation">
        <a href="./admin.html">Overview</a>
        <a href="./admin-students.html" class="active">Students</a>
      </nav>
      <div class="header-actions">
        <button class="btn btn-secondary btn-small" type="button" id="logoutBtn">Logout</button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container app-shell">
      <aside class="sidebar">
        <nav>
          <a href="./admin.html"><span>Overview</span><span>›</span></a>
          <a class="active" href="./admin-students.html"><span>Students</span><span>›</span></a>
        </nav>
      </aside>

      <div class="content-area">
        <section class="panel">
          <div class="flex justify-between wrap" style="gap:16px; align-items:center;">
            <div>
              <span class="eyebrow" style="color:#2857b1; background:rgba(59,130,246,0.09); border-color:rgba(59,130,246,0.12);">Student management</span>
              <h2 style="margin-top:12px;">Manage learner accounts</h2>
            </div>
          </div>

          <div class="flex gap-16 wrap" style="margin-top:18px; align-items:flex-end;">
            <div class="field" style="flex:1; min-width:220px;">
              <label for="studentSearch">Search</label>
              <input id="studentSearch" type="search" placeholder="Name or email" />
            </div>
            <div class="field" style="min-width:180px;">
              <label for="statusFilter">Status</label>
              <select id="statusFilter">
                <option value="">All</option>
                <option value="ACTIVE">Active</option>
                <option value="SUSPENDED">Suspended</option>
              </select>
            </div>
            <button class="btn btn-primary" type="button" id="searchStudentsBtn">Search</button>
          </div>
        </section>

        <section class="panel" style="margin-top:22px;">
          <div id="studentsList" class="task-list"></div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
