<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" role="img" aria-label="ZERA">
  <defs>
    <linearGradient id="logoGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  
  <!-- Symbol: Compact geometric Z -->
  <g id="symbol" transform="translate(0, 6)">
    <!-- Foundation bar -->
    <rect x="0" y="24" width="28" height="4" rx="2" fill="url(#logoGradient)"/>
    <!-- Transformation diagonal -->
    <path d="M26,28 L4,4" stroke="url(#logoGradient)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Mastery bar -->
    <rect x="4" y="0" width="24" height="4" rx="2" fill="url(#logoGradient)"/>
    <!-- Accent dot -->
    <circle cx="26" cy="2" r="2.5" fill="#22C3FF" opacity="0.95"/>
  </g>
  
  <!-- Wordmark -->
  <g id="wordmark" transform="translate(38, 0)">
    <text x="0" y="32" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.03em" fill="#06121F">ZERA</text>
    <text x="0" y="32" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.03em" fill="url(#logoGradient)" opacity="0.15">Z</text>
  </g>
</svg>