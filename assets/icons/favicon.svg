<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ZERA favicon">
  <defs>
    <linearGradient id="faviconGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#06121F"/>
  
  <!-- Symbol: Geometric Z - centered and scaled for favicon -->
  <g transform="translate(8, 8)">
    <!-- Foundation bar -->
    <rect x="0" y="32" width="36" height="5" rx="2.5" fill="url(#faviconGradient)"/>
    <!-- Transformation diagonal -->
    <path d="M34,37 L6,5" stroke="url(#faviconGradient)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Mastery bar -->
    <rect x="6" y="-1" width="30" height="5" rx="2.5" fill="url(#faviconGradient)"/>
    <!-- Accent dot -->
    <circle cx="34" cy="2" r="3" fill="#22C3FF" opacity="0.95"/>
  </g>
</svg>