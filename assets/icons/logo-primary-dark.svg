<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="ZERA">
  <defs>
    <linearGradient id="logoGradientDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  
  <!-- Symbol: Geometric Z representing learning progression -->
  <g id="symbol" transform="translate(0, 10)">
    <!-- Foundation bar (bottom horizontal) -->
    <rect x="0" y="42" width="50" height="6" rx="3" fill="url(#logoGradientDark)"/>
    <!-- Transformation diagonal -->
    <path d="M46,48 L10,0" stroke="url(#logoGradientDark)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Mastery bar (top horizontal) -->
    <rect x="10" y="-6" width="40" height="6" rx="3" fill="url(#logoGradientDark)"/>
    <!-- Accent dot - represents the "spark" of understanding -->
    <circle cx="46" cy="-3" r="4" fill="#67E8F9" opacity="0.95"/>
  </g>
  
  <!-- Wordmark: ZERA in custom geometric typography -->
  <g id="wordmark" transform="translate(70, 0)">
    <text x="0" y="58" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="-0.04em" fill="#F4F9FF">ZERA</text>
    <!-- Subtle accent on the Z -->
    <text x="0" y="58" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="-0.04em" fill="url(#logoGradientDark)" opacity="0.2">Z</text>
  </g>
</svg>