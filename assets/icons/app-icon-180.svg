<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="ZERA app icon">
  <defs>
    <linearGradient id="appIconGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06121F" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with subtle gradient -->
  <rect x="10" y="10" width="160" height="160" rx="40" fill="#06121F" filter="url(#shadow)"/>
  <rect x="10" y="10" width="160" height="160" rx="40" fill="url(#appIconGradient)" opacity="0.08"/>
  
  <!-- Symbol: Geometric Z - large for app icon -->
  <g transform="translate(25, 25)">
    <!-- Foundation bar -->
    <rect x="0" y="92" width="100" height="12" rx="6" fill="url(#appIconGradient)"/>
    <!-- Transformation diagonal -->
    <path d="M94,104 L16,8" stroke="url(#appIconGradient)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Mastery bar -->
    <rect x="16" y="-4" width="86" height="12" rx="6" fill="url(#appIconGradient)"/>
    <!-- Accent dot -->
    <circle cx="94" cy="2" r="8" fill="#22C3FF" opacity="0.95"/>
  </g>
</svg>