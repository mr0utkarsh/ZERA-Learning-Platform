<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZERA Support</title>
  <meta name="description" content="Get support and assistance for your ZERA learning experience." />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <script src="./js/storage.js" defer></script>
  <script src="./js/support.js" defer></script>
  <script src="./js/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="./index.html" class="brand" aria-label="ZERA home"><span class="brand-mark"><span>Z</span></span><span>ZERA</span></a>
      <nav class="nav" aria-label="Main navigation">
        <a href="./dashboard.html">Dashboard</a>
        <a href="./support.html" class="active">Support</a>
      </nav>
      <div class="header-actions"><a class="btn btn-primary btn-small" href="./dashboard.html">Dashboard</a></div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="panel">
        <h2>Support Center</h2>
        <form id="supportForm" style="margin-top:16px;">
          <div class="field"><label for="supportCategory">Category</label><input id="supportCategory" name="category" required value="Learning support" /></div>
          <div class="field" style="margin-top:14px;"><label for="supportSubject">Subject</label><input id="supportSubject" name="subject" required /></div>
          <div class="field" style="margin-top:14px;"><label for="supportMessage">Message</label><textarea id="supportMessage" name="message" required></textarea></div>
          <button class="btn btn-primary" type="submit" style="margin-top:16px;">Send support request</button>
          <div id="supportStatus" class="notice" style="margin-top:14px;" hidden></div>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer"><div class="container"><small>© 2026 ZERA</small></div></footer>
</body>
</html>
