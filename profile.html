<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZERA Profile</title>
  <meta name="description" content="View and manage your ZERA learner profile information and preferences." />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <script src="./js/api.js" defer></script>
  <script src="./js/profile.js" defer></script>
  <script src="./js/storage.js" defer></script>
  <script src="./js/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="./index.html" class="brand" aria-label="ZERA home"><span class="brand-mark"><span>Z</span></span><span>ZERA</span></a>
      <nav class="nav" aria-label="Main navigation">
        <a href="./dashboard.html">Dashboard</a>
        <a href="./syllabus.html">Syllabus</a>
        <a href="./notes.html">Notes</a>
        <a href="./quiz.html">Quiz</a>
        <a href="./study-plan.html">Study Plan</a>
        <a href="./resources.html">Resources</a>
      </nav>
      <div class="header-actions">
        <a class="btn btn-secondary btn-small" href="./settings.html">Settings</a>
        <a class="btn btn-primary btn-small" href="./dashboard.html">Dashboard</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="panel">
        <h2>Profile</h2>

        <div class="form-grid" style="margin-top:18px;">
          <div class="field">
            <label>Full name</label>
            <p id="profileName" style="font-weight:600;"></p>
          </div>
          <div class="field">
            <label>Email</label>
            <p id="profileEmail" style="font-weight:600;"></p>
          </div>
          <div class="field">
            <label>Role</label>
            <p id="profileRole" style="font-weight:600;"></p>
          </div>
          <div class="field">
            <label>Member since</label>
            <p id="profileMemberSince" style="font-weight:600;"></p>
          </div>
        </div>

        <h3 style="margin-top:26px;">Edit details</h3>
        <form id="profileForm" class="form-grid" style="margin-top:14px;">
          <div class="field">
            <label for="profilePhone">Phone</label>
            <input id="profilePhone" name="phone" type="tel" placeholder="Optional" />
          </div>
          <div class="field">
            <label for="profileInstitution">Institution</label>
            <input id="profileInstitution" name="institution" type="text" placeholder="Optional" />
          </div>
          <div class="field">
            <label for="profileCity">City</label>
            <input id="profileCity" name="city" type="text" placeholder="Optional" />
          </div>
          <div class="field">
            <label for="profileGraduationYear">Graduation year</label>
            <input id="profileGraduationYear" name="graduationYear" type="number" min="1990" max="2100" placeholder="Optional" />
          </div>
          <div class="field" style="grid-column: 1 / -1;">
            <label for="profileBio">Bio</label>
            <textarea id="profileBio" name="bio" placeholder="Tell us a little about your study goals" maxlength="500"></textarea>
          </div>
          <div style="grid-column: 1 / -1;">
            <button class="btn btn-primary" type="submit">Save profile</button>
          </div>
        </form>

        <div class="notice" id="profileMessage" aria-live="polite" style="margin-top:14px;"></div>
      </div>
    </div>
  </main>

  <footer class="footer"><div class="container"><small>© 2026 ZERA</small></div></footer>
</body>
</html>
