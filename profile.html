<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZERA Profile</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/responsive.css"><script src="./js/profile.js" defer></script><script src="./js/app.js" defer></script></head><body><header class="site-header"><div class="container header-inner"><a href="./index.html" class="brand"><span class="brand-mark"><span>Z</span></span><span>ZERA</span></a><nav class="nav"><a href="./dashboard.html">Dashboard</a><a href="./profile.html" class="active">Profile</a><a href="./settings.html">Settings</a></nav></div></header><main class="section"><div class="container"><div class="panel"><h2>Your profile</h2><p>Changes are saved to your account.</p><form id="profileForm" class="form-grid" style="margin-top:18px"><div class="field"><label for="name">Full name</label><input id="name" name="name" required></div><div class="field"><label for="email">Email</label><input id="email" type="email" readonly></div><div class="field"><label for="phone">Phone</label><input id="phone" name="phone"></div><div class="field"><label for="institution">Institution</label><input id="institution" name="institution"></div><div class="field"><label for="city">City</label><input id="city" name="city"></div><div class="field"><label for="studyLevel">Study level</label><input id="studyLevel" name="studyLevel"></div><div class="field"><label for="weeklyHours">Weekly study hours</label><input id="weeklyHours" name="weeklyHours" type="number" min="1" max="80"></div><div class="field"><label for="learningGoal">Learning goal</label><input id="learningGoal" name="learningGoal"></div><div class="field" style="grid-column:1/-1"><label for="bio">Bio</label><textarea id="bio" name="bio"></textarea></div><div><button class="btn btn-primary" type="submit">Save profile</button></div></form><div id="profileMessage" class="notice" style="margin-top:16px" aria-live="polite"></div></div></div></main><footer class="footer"><div class="container"><small>© 2026 ZERA</small></div></footer></body></html>
