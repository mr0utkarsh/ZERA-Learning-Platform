<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ZERA Bookmarks</title><meta name="description" content="Save and manage learning bookmarks in your ZERA account."><link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/responsive.css"><script src="./js/bookmarks.js" defer></script><script src="./js/app.js" defer></script></head><body><header class="site-header"><div class="container header-inner"><a href="./index.html" class="brand"><span class="brand-mark"><span>Z</span></span><span>ZERA</span></a><nav class="nav"><a href="./dashboard.html">Dashboard</a><a href="./bookmarks.html" class="active">Bookmarks</a></nav><div class="header-actions"><a class="btn btn-primary btn-small" href="./dashboard.html">Dashboard</a></div></div></header><main class="section"><div class="container grid-2"><section class="panel"><h2>Save a bookmark</h2><form id="bookmarkForm" style="margin-top:16px"><div class="field"><label for="title">Title</label><input id="title" name="title" required maxlength="160"></div><div class="field" style="margin-top:12px"><label for="url">Link (optional)</label><input id="url" name="url" type="url" placeholder="https://example.com"></div><div class="field" style="margin-top:12px"><label for="notes">Notes (optional)</label><textarea id="notes" name="notes" maxlength="2000"></textarea></div><button class="btn btn-primary" style="margin-top:16px" type="submit">Save bookmark</button></form><div id="bookmarkMessage" class="notice" style="margin-top:16px" aria-live="polite"></div></section><section class="panel"><h2>Saved bookmarks</h2><div id="bookmarkList" style="margin-top:16px"></div></section></div></main><footer class="footer"><div class="container"><small>© 2026 ZERA</small></div></footer></body></html>
