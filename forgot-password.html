<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZERA Forgot Password</title>
  <meta name="description" content="Request a ZERA password reset link." />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <script src="./js/storage.js" defer></script>
  <script src="./js/auth.js" defer></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <a href="./index.html" class="brand" aria-label="ZERA home" style="color:#0c1d31; margin-bottom: 18px; display:inline-flex;">
        <span class="brand-mark"><span>Z</span></span><span>ZERA</span>
      </a>
      <h1>Forgot password</h1>
      <p>Enter your email to request a reset link.</p>
      <form id="forgotForm" style="margin-top:18px;">
        <div class="field">
          <label for="forgotEmail">Email</label>
          <input id="forgotEmail" name="email" type="email" placeholder="student@zera.app" required />
        </div>
        <div style="margin-top:18px;"><button class="btn btn-primary" type="submit">Send reset link</button></div>
        <div id="authMessage" class="notice" style="margin-top: 16px;">Email delivery depends on configured provider settings.</div>
      </form>
    </div>
  </div>
</body>
</html>
