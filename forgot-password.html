<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password - ZERA</title>
  <meta name="description" content="Request a ZERA password reset link." />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <script>
    window.ZERA_API_BASE = '';
  </script>
  <script src="./js/storage.js" defer></script>
  <script src="./js/auth.js" defer></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <a href="./index.html" class="brand" aria-label="ZERA home">
        <span class="brand-mark"><span>Z</span></span><span>ZERA</span>
      </a>
      <h1 class="auth-heading">Forgot password</h1>
      <p class="auth-subheading">Enter your email address and we will send reset instructions if an account exists.</p>

      <form id="forgotForm" class="auth-form" novalidate autocomplete="on">
        <div class="field">
          <label for="forgotEmail">Email address</label>
          <input id="forgotEmail" name="email" type="email" inputmode="email" autocomplete="email"
            placeholder="name@example.com" required />
          <span class="error-text" id="forgotEmailError" aria-live="polite"></span>
        </div>
        <div class="field field--submit">
          <button class="btn btn-primary btn--block" type="submit" id="forgotSubmit">Send reset link</button>
        </div>
        <div class="auth-links" style="margin-top: 14px; justify-content: center; gap: 10px;">
          <a href="./login.html">Remembered your password? Sign in</a>
          <a href="./signup.html">Create an account</a>
        </div>
        <p class="hint">Reset delivery depends on the configured email provider. If no provider is set up, contact your administrator.</p>
        <div id="authMessage" class="notice notice--live" aria-live="polite"></div>
      </form>
    </div>
  </div>
</body>
</html>
