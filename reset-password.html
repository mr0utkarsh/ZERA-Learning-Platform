<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password - ZERA</title>
  <meta name="description" content="Set a new ZERA password using a reset token." />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <script>
    window.ZERA_API_BASE = '';
  </script>
  <script src="./js/storage.js" defer></script>
  <script src="./js/auth.js" defer></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <a href="./index.html" class="brand" aria-label="ZERA home">
        <span class="brand-mark"><span>Z</span></span><span>ZERA</span>
      </a>
      <h1 class="auth-heading">Reset password</h1>
      <p class="auth-subheading">Create a new password for your ZERA account using the reset link from your email.</p>

      <form id="resetForm" class="auth-form" novalidate autocomplete="on">
        <div class="field">
          <label for="newPassword">New password</label>
          <div class="password-input">
            <input id="newPassword" name="password" type="password" autocomplete="new-password"
              placeholder="••••••••" required />
            <button type="button" class="password-toggle" id="toggleResetPassword"
              aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <div class="strength-meter" id="resetStrengthMeter" aria-hidden="true">
            <div class="strength-bar" id="resetStrengthBar"></div>
          </div>
          <p id="resetStrengthText" class="strength-text" aria-live="polite"></p>
          <span class="error-text" id="resetPasswordError" aria-live="polite"></span>
        </div>
        <div class="field field--submit">
          <button class="btn btn-primary btn--block" type="submit" id="resetSubmit">Reset password</button>
        </div>
        <div class="auth-links" style="margin-top: 14px; justify-content: center; gap: 10px;">
          <a href="./login.html">Remembered your password? Sign in</a>
        </div>
        <p class="hint">This link is single-use and expires shortly. Request a new one if it has expired.</p>
        <div id="authMessage" class="notice notice--live" aria-live="polite"></div>
      </form>
    </div>
  </div>
</body>
</html>
