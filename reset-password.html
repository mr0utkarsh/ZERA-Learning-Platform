<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZERA Reset Password</title>
  <meta name="description" content="Set a new ZERA password using a reset token." />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <script src="./js/storage.js" defer></script>
  <script src="./js/auth.js" defer></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <a href="./index.html" class="brand" aria-label="ZERA home" style="color:#0c1d31; margin-bottom: 18px; display:inline-flex;">
        <span class="brand-mark"><span>Z</span></span><span>ZERA</span>
      </a>
      <h1>Reset password</h1>
      <p>Create a new password for your ZERA account using the reset token from your email.</p>
      <form id="resetForm" style="margin-top:18px;">
        <div class="field">
          <label for="newPassword">New password</label>
          <input id="newPassword" name="password" type="password" placeholder="••••••••" required />
        </div>
        <div style="margin-top:18px;"><button class="btn btn-primary" type="submit">Reset password</button></div>
        <div id="authMessage" class="notice" style="margin-top: 16px;">Reset requires a valid token in the URL.</div>
      </form>
    </div>
  </div>
</body>
</html>
