<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZERA Admin Login</title>
  <meta name="description" content="Secure admin login for the ZERA platform." />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <script src="./js/storage.js" defer></script>
  <script src="./js/auth.js" defer></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <a href="./index.html" class="brand" aria-label="ZERA home" style="color:#0c1d31; margin-bottom: 18px; display:inline-flex;">
        <span class="brand-mark"><span>Z</span></span><span>ZERA</span>
      </a>
      <h1>Admin login</h1>
      <p>Access the secure admin monitoring portal.</p>
      <form id="adminLoginForm" style="margin-top:18px;">
        <div class="field">
          <label for="adminEmail">Admin email</label>
          <input id="adminEmail" name="email" type="email" placeholder="admin@zera.app" required />
        </div>
        <div class="field" style="margin-top:14px;">
          <label for="adminPassword">Password</label>
          <input id="adminPassword" name="password" type="password" placeholder="••••••••" required />
        </div>
        <div style="margin-top:18px;"><button class="btn btn-primary" type="submit">Access admin</button></div>
        <div id="authMessage" class="notice" style="margin-top:16px;">Admin authentication is enabled.</div>
      </form>
    </div>
  </div>
</body>
</html>
