<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create your ZERA account</title>
  <meta name="description" content="Create a ZERA account and start your personalized learning journey." />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <script>
    window.ZERA_API_BASE = '';
  </script>
  <script src="./js/storage.js" defer></script>
  <script src="./js/auth.js" defer></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <a href="./index.html" class="brand" aria-label="ZERA home">
        <span class="brand-mark"><span>Z</span></span><span>ZERA</span>
      </a>
      <h1 class="auth-heading">Create your account</h1>
      <p class="auth-subheading">Join ZERA and start your personalized learning journey.</p>

      <form id="signupForm" class="auth-form" novalidate autocomplete="on">
        <div class="field">
          <label for="signupName">Full name</label>
          <input id="signupName" name="name" type="text" autocomplete="name"
            placeholder="Your name" required />
          <span class="error-text" id="signupNameError" aria-live="polite"></span>
        </div>
        <div class="field">
          <label for="signupEmail">Email address</label>
          <input id="signupEmail" name="email" type="email" inputmode="email" autocomplete="email"
            placeholder="name@example.com" required />
          <span class="error-text" id="signupEmailError" aria-live="polite"></span>
        </div>
        <div class="field">
          <label for="signupPassword">Password</label>
          <div class="password-input">
            <input id="signupPassword" name="password" type="password" autocomplete="new-password"
              placeholder="••••••••" required />
            <button type="button" class="password-toggle" id="toggleSignupPassword"
              aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <div class="strength-meter" id="signupStrengthMeter" aria-hidden="true">
            <div class="strength-bar" id="signupStrengthBar"></div>
          </div>
          <p id="signupStrengthText" class="strength-text" aria-live="polite"></p>
          <span class="error-text" id="signupPasswordError" aria-live="polite"></span>
        </div>
        <div class="field">
          <label for="signupConfirmPassword">Confirm password</label>
          <div class="password-input">
            <input id="signupConfirmPassword" name="confirmPassword" type="password"
              autocomplete="new-password" placeholder="••••••••" required />
            <button type="button" class="password-toggle" id="toggleSignupConfirmPassword"
              aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <span class="error-text" id="signupConfirmError" aria-live="polite"></span>
        </div>
        <div class="auth-links" style="margin-top: 6px;">
          <a href="./login.html">Already have an account? Sign in</a>
        </div>
        <div class="field field--submit">
          <button class="btn btn-primary btn--block" type="submit" id="signupSubmit">Create account</button>
        </div>
        <div class="oauth-divider"><span>Or continue with</span></div>
        <div class="oauth-buttons">
          <button type="button" class="btn btn-oauth btn-google" id="oauthGoogleSignup"
            aria-describedby="oauthGoogleSignupHint">
            <span class="oauth-icon"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#ea4335" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#4285f4" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#f4b400" d="M5.84 14.09c-.22-.62-.35-1.3-.35-2.09s.13-1.47.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#34a853" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 3.99 7.07h3.66c.22-.62.35-1.3.35-2.09z"/></svg></span>
            <span>Continue with Google</span>
          </button>
          <button type="button" class="btn btn-oauth btn-github" id="oauthGithubSignup"
            aria-describedby="oauthGithubSignupHint">
            <span class="oauth-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></path></svg></span>
            <span>Continue with GitHub</span>
          </button>
        </div>
        <p id="oauthGoogleSignupHint" class="hint" style="display:none;">Google sign-up is not configured yet.</p>
        <p id="oauthGithubSignupHint" class="hint" style="display:none;">GitHub sign-up is not configured yet.</p>

        <div id="authMessage" class="notice notice--live" aria-live="polite"></div>
      </form>
    </div>
  </div>
</body>
</html>
