<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="ZERA logo mark - icon only" role="img">
  <defs>
    <linearGradient id="zeraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#755CFF"/>
      <stop offset="55%" stop-color="#B45DFF"/>
      <stop offset="100%" stop-color="#19C7D7"/>
    </linearGradient>
    <filter id="zeraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0A0A14"/>
  <!-- Primary Z path forming abstract forward/upward arrow -->
  <path
    d="M12 44 L12 20 L22 20 L32 8 L32 20 L22 20 L12 44"
    fill="none" stroke="url(#zeraGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Upward arrow tip at top-right -->
  <path
    d="M32 8 L28 14 L36 14 Z"
    fill="url(#zeraGradient)"/>
</svg>