<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify email - ZERA</title>
  <meta name="description" content="Verify your ZERA email address." />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <script>
    window.ZERA_API_BASE = '';
  </script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <a href="./index.html" class="brand" aria-label="ZERA home">
        <span class="brand-mark"><span>Z</span></span><span>ZERA</span>
      </a>
      <h1 class="auth-heading">Verify your email</h1>
      <p id="verifyStatus" class="auth-subheading">Verifying your email address…</p>
      <div id="authMessage" class="notice notice--live" aria-live="polite"></div>
      <p class="hint" style="margin-top: 14px;"><a href="./login.html">Return to sign in</a> |
         <a id="resendLink" href="#" style="display:none;">Didn't receive the email? Resend</a></p>
    </div>
  </div>
  <script>
    (function () {
      const API_BASE = (window.ZERA_API_BASE && String(window.ZERA_API_BASE).replace(/\/$/, '')) || 'http://localhost:5000';
      const statusEl = document.getElementById('verifyStatus');
      const messageEl = document.getElementById('authMessage');
      const resendLink = document.getElementById('resendLink');

      function show(text, type = 'info') {
        if (!messageEl) return;
        messageEl.textContent = text;
        messageEl.className = 'notice notice--live ' + (type === 'success' ? 'notice--success' : type === 'error' ? 'notice--error' : 'notice--info');
      }

      const qs = new URLSearchParams(window.location.search);
      const token = qs.get('token') || '';

      if (!token) {
        statusEl.textContent = 'Verification cannot proceed.';
        show('No verification token was provided in the link.', 'error');
        return;
      }

      fetch(`${API_BASE}/api/auth/verify-email?token=${encodeURIComponent(token)}`, {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' }
      })
        .then(async (response) => {
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.success) {
            throw new Error(data.message || 'Invalid or expired verification token.');
          }
          statusEl.textContent = 'Email verified successfully.';
          show(data.message || 'Your email address has been verified.', 'success');
          resendLink.style.display = 'none';
          setTimeout(() => { window.location.href = './login.html'; }, 1200);
        })
        .catch((error) => {
          statusEl.textContent = 'Verification failed.';
          show(error.message || 'The verification link is invalid or has expired. Request a new one.', 'error');
          resendLink.style.display = 'inline';
          resendLink.onclick = (ev) => {
            ev.preventDefault();
            window.location.href = './login.html';
          };
        });
    })();
  </script>
</body>
</html>
